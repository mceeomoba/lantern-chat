name: android-preview
on:
  workflow_dispatch:
  push:
    paths: ['lantern-src.b64.txt']
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if [ -f lantern-src.b64.txt ]; then
            base64 -d lantern-src.b64.txt | tar xz
            git rm -q --cached lantern-src.b64.txt; rm lantern-src.b64.txt
            git config user.name lantern-bot
            git config user.email lantern-bot@users.noreply.github.com
            git add -A
            git commit -m "Unpack Lantern source"
            git push
          fi
  build:
    needs: unpack
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        app: [user-app, admin-app]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: |
          cd ${{ matrix.app }}
          npm install --no-audit --no-fund
          npx expo prebuild --platform android --no-install
          cd android
          ./gradlew assembleRelease -x lint -PreactNativeArchitectures=arm64-v8a --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: lantern-${{ matrix.app }}-preview-apk
          path: ${{ matrix.app }}/android/app/build/outputs/apk/release/*.apk
          retention-days: 7
      - name: Publish APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=preview-${{ github.run_number }}
          gh release create "$TAG" --repo "${{ github.repository }}" --title "Lantern preview $TAG" --notes "Debug-signed preview APKs. Not a store release." || true
          cp ${{ matrix.app }}/android/app/build/outputs/apk/release/app-release.apk lantern-${{ matrix.app }}-$TAG.apk
          gh release upload "$TAG" lantern-${{ matrix.app }}-$TAG.apk --repo "${{ github.repository }}" --clobber
